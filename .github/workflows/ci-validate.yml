name: CI Dataset & Code Quality Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-json:
    name: Validate JSON Datasets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate JSON Files Syntax
        run: |
          for f in data/resources.json data/roadmaps/index.json data/roadmaps/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON datasets are valid syntax."

      - name: Verify HTML Files Exist
        run: |
          for f in index.html drone-engineer.html roadmap.html roadmaps/drone-development-engineer/index.html; do
            test -f "$f" || { echo "Missing HTML: $f"; exit 1; }
          done
          echo "All HTML files present."
